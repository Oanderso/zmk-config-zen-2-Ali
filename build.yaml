include:
  - board: corneish_zen_v2_left
    cmake-args: -DEXTRA_CONF_FILE=${GITHUB_WORKSPACE}/config/corneish_zen_v2_left.conf

  - board: corneish_zen_v2_right
    snippet: zmk-usb-logging
    # Use the supported USB logging snippet for the diagnostic firmware. Keep
    # the inertia include-path workaround unchanged.
    cmake-args: -DEXTRA_CONF_FILE=${GITHUB_WORKSPACE}/config/corneish_zen_v2_right.conf -DCMAKE_C_FLAGS=-I${GITHUB_WORKSPACE}/zmk/app/include

  - board: nice_nano_v2
    shield: settings_reset
