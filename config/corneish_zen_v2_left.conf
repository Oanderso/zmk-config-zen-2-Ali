# Left half: BLE split peripheral. The left e-ink display remains installed.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
CONFIG_ZMK_USB=n
CONFIG_ZMK_BLE=y
CONFIG_ZMK_DISPLAY=y

# The stock output/layer widgets call central-only endpoint and keymap APIs,
# so they cannot be linked into a split peripheral. Use the dedicated
# peripheral connection-status widget instead; battery status remains enabled.
CONFIG_CUSTOM_WIDGET_OUTPUT_STATUS=n
CONFIG_CUSTOM_WIDGET_LAYER_STATUS=n
CONFIG_CUSTOM_WIDGET_PERIPHERAL_STATUS=y
