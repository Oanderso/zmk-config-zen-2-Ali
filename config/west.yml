manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: amgskobo
      url-base: https://github.com/amgskobo

  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.3.0
      import: app/west.yml

    # The pinned IQS5xx driver is vendored in local-modules/tps43-release-inertia
    # with explicit finger-contact reports for release-only cursor glide.

    # Keep the older inertia implementation because it uses the plural
    # zmk_endpoints_* API provided by ZMK v0.3.0. The build matrix supplies
    # ZMK's app/include directory to work around this revision's CMake omission.
    - name: zmk-input-inertia
      remote: amgskobo
      revision: 57cea03b24ab87c031516abf8d0ab78a8339097b

  self:
    path: config
