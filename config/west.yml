manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: aym1607
      url-base: https://github.com/AYM1607
    - name: amgskobo
      url-base: https://github.com/amgskobo

  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.3.0
      import: app/west.yml

    # IQS5xx driver. TPS43 is explicitly supported by this driver.
    - name: zmk-driver-azoteq-iqs5xx
      remote: aym1607
      revision: 27321f0232b50f0af31eb27ff97d539933467ea4

    # Keep the older inertia implementation because it uses the plural
    # zmk_endpoints_* API provided by ZMK v0.3.0. The build matrix supplies
    # ZMK's app/include directory to work around this revision's CMake omission.
    - name: zmk-input-inertia
      remote: amgskobo
      revision: 57cea03b24ab87c031516abf8d0ab78a8339097b

  self:
    path: config
