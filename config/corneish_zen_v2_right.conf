# Right half: host-facing split central with TPS43 pointing input.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# Explicit host-facing product name. This ensures Windows receives a USB
# product string instead of falling back to the generic "USB Composite Device"
# label for the freshly enumerated keyboard.
CONFIG_USB_DEVICE_PRODUCT="Corne-ish Zen"

# The right e-ink display has been physically removed.
CONFIG_ZMK_DISPLAY=n

# Azoteq TPS43 / IQS5xx touchpad and ZMK pointing stack.
CONFIG_I2C=y
CONFIG_INPUT=y
CONFIG_INPUT_AZOTEQ_IQS5XX=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y

# Advertise HID Resolution Multipliers so supported hosts interpret wheel
# reports at higher resolution. This makes two-finger scrolling feel much
# closer to continuous/stepless without changing the existing scroll direction.
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# ZMK Studio. Keep Studio permanently unlocked so no studio_unlock binding
# is required and the device does not auto-lock between sessions.
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
