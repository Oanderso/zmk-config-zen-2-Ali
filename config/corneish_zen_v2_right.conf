# Right half: host-facing split central with TPS43 pointing input.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# The right e-ink display has been physically removed.
CONFIG_ZMK_DISPLAY=n

# Azoteq TPS43 / IQS5xx touchpad and ZMK pointing stack.
CONFIG_I2C=y
CONFIG_INPUT=y
CONFIG_INPUT_AZOTEQ_IQS5XX=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y
