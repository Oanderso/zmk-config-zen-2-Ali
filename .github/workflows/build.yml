on: [push, pull_request, workflow_dispatch]

jobs:
  cursor-inertia-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test release-only cursor glide
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/test_cursor_glide.c -o /tmp/test-cursor-glide
          /tmp/test-cursor-glide
      - name: Test tap and drag button ownership
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/test_tps43_buttons.c -o /tmp/test-tps43-buttons
          /tmp/test-tps43-buttons
      - name: Test three-finger swipe recognition
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/test_tps43_swipe.c -o /tmp/test-tps43-swipe
          /tmp/test-tps43-swipe
  build:
    needs: cursor-inertia-tests
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3.0
